<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <title>Centria Edu | Basics of Web Development</title>

    <style>
    </style>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#topics">Topics</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="#"><b>Contact us</b></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="container">
                <div class="hero-content">

                    <span class="label">Basics of Web Development</span>

                    <h1>
                        Learn how the web works.
                    </h1>

                    <p>
                        Start from HTML and CSS and gradually build modern,
                        responsive and interactive web applications.
                    </p>

                    <a href="#topics" class="button">
                        Contact Us
                    </a>

                </div>
            </div>
        </section>

        <section class="topics" id="contact">
            <form class="card" action="https://httpbin.org/post" method="post">

                <div class="form-items">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <br><br>

                <div class="form-items">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <br><br>

                <div class="form-items">
                    <div class="form-items"></div>
                    <label for="tel">Phone number:</label>
                    <input for="tel" id="tel" name="tel">
                </div>
                <br><br>

                <div class="form-items">
                    <label for="subject">Contact Subject:</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a subject</option>
                        <option value="Centria">Learn more about Centria</option>
                        <option value="html">Learn more about HTML</option>
                        <option value="CSS">Learn more about CSS</option>
                    </select>
                </div>
                <br><br>

                <div class="radio-option">
                    <p>Preferred contact method:</p>
                    <input type="radio" id="mail" name="contactmethod" value="mail">
                    <label for="mail">Email</label>
                    <br>
                    <input type="radio" id="phone" name="contactmethod" value="phone">
                    <label for="phone">Phone Call</label>
                </div>
                <br><br>

                <div class="form-items">
                    <label for="message">Message:</label>
                </div>

                <div class="form-items">
                    <textarea id="message" name="message" required></textarea>
                </div>
                <br><br>

                <button type="submit" class="button">Submit</button>
                <button type="reset" class="button">Reset</button>
            </form>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>

</body>

</html>
